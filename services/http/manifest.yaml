# HTTP service — Tier 1, OS-aware (IIS on Windows, nginx on Linux).
#
# Per-method responses gated by os_family so the Server header + default page match
# the emulated OS (Microsoft-IIS vs nginx). Every response carries a live Date via
# the http_date rewrite (which finds the Date: header and writes the current
# RFC1123 time), fixing the stale captured-Date tell.
#
# Within each method: windows probe, then linux, then a generic fallback. The
# requires gating excludes the non-matching ones at load time, so the right one
# wins. macOS / no-profile falls through to the generic (IIS) variant.

name: http
port: 80
protocol: tcp
stateful: false

probes:
  # --- GET /backup_credentials.txt -> planted cred (cross-service leak loop) ---
  - name: http_get_backup_creds_windows
    signature: { pattern: 'GET /backup_credentials', offset: 0, min_length: 22 }
    response_file: responses/iis_backup_creds_200.bin
    requires: { os_family: "windows" }
    rewrite_rules: [{ type: http_date }]
  - name: http_get_backup_creds_generic
    signature: { pattern: 'GET /backup_credentials', offset: 0, min_length: 22 }
    response_file: responses/iis_backup_creds_200.bin
    rewrite_rules: [{ type: http_date }]

  # --- GET / (site root only — other paths fall through to 404 catch-all) ---
  - name: http_get_root_windows
    signature: { pattern: 'GET / HTTP', offset: 0, min_length: 10 }
    response_file: responses/iis_200_full.bin
    requires: { os_family: "windows" }
    rewrite_rules: [{ type: http_date }]
  - name: http_get_root_linux
    signature: { pattern: 'GET / HTTP', offset: 0, min_length: 10 }
    response_file: responses/nginx_200_full.bin
    requires: { os_family: "linux" }
    rewrite_rules: [{ type: http_date }]
  - name: http_get_root_generic
    signature: { pattern: 'GET / HTTP', offset: 0, min_length: 10 }
    response_file: responses/iis_200_full.bin
    rewrite_rules: [{ type: http_date }]
  - name: http_get_index_windows
    signature: { pattern: 'GET /index.html HTTP', offset: 0, min_length: 18 }
    response_file: responses/iis_200_full.bin
    requires: { os_family: "windows" }
    rewrite_rules: [{ type: http_date }]
  - name: http_get_index_generic
    signature: { pattern: 'GET /index.html HTTP', offset: 0, min_length: 18 }
    response_file: responses/iis_200_full.bin
    rewrite_rules: [{ type: http_date }]

  # --- HEAD / (site root only — other paths fall through to 404 catch-all) ---
  - name: http_head_root_windows
    signature: { pattern: 'HEAD / HTTP', offset: 0, min_length: 11 }
    response_file: responses/iis_200_headers.bin
    requires: { os_family: "windows" }
    rewrite_rules: [{ type: http_date }]
  - name: http_head_root_linux
    signature: { pattern: 'HEAD / HTTP', offset: 0, min_length: 11 }
    response_file: responses/nginx_200_headers.bin
    requires: { os_family: "linux" }
    rewrite_rules: [{ type: http_date }]
  - name: http_head_root_generic
    signature: { pattern: 'HEAD / HTTP', offset: 0, min_length: 11 }
    response_file: responses/iis_200_headers.bin
    rewrite_rules: [{ type: http_date }]
  - name: http_head_index_windows
    signature: { pattern: 'HEAD /index.html HTTP', offset: 0, min_length: 19 }
    response_file: responses/iis_200_headers.bin
    requires: { os_family: "windows" }
    rewrite_rules: [{ type: http_date }]
  - name: http_head_index_generic
    signature: { pattern: 'HEAD /index.html HTTP', offset: 0, min_length: 19 }
    response_file: responses/iis_200_headers.bin
    rewrite_rules: [{ type: http_date }]
  - name: http_options_windows
    signature: { pattern: 'OPTIONS ', offset: 0, min_length: 8 }
    response_file: responses/iis_200_headers.bin
    requires: { os_family: "windows" }
    rewrite_rules: [{ type: http_date }]
  - name: http_options_linux
    signature: { pattern: 'OPTIONS ', offset: 0, min_length: 8 }
    response_file: responses/nginx_200_headers.bin
    requires: { os_family: "linux" }
    rewrite_rules: [{ type: http_date }]
  - name: http_options_generic
    signature: { pattern: 'OPTIONS ', offset: 0, min_length: 8 }
    response_file: responses/iis_200_headers.bin
    rewrite_rules: [{ type: http_date }]

  # --- POST and any other method -> 404 ---
  - name: http_post_windows
    signature: { pattern: 'POST ', offset: 0, min_length: 5 }
    response_file: responses/iis_404_not_found.bin
    requires: { os_family: "windows" }
    rewrite_rules: [{ type: http_date }]
  - name: http_post_linux
    signature: { pattern: 'POST ', offset: 0, min_length: 5 }
    response_file: responses/nginx_404.bin
    requires: { os_family: "linux" }
    rewrite_rules: [{ type: http_date }]
  - name: http_other_windows
    signature: { offset: 0, min_length: 1 }
    response_file: responses/iis_404_not_found.bin
    requires: { os_family: "windows" }
    rewrite_rules: [{ type: http_date }]
  - name: http_other_linux
    signature: { offset: 0, min_length: 1 }
    response_file: responses/nginx_404.bin
    requires: { os_family: "linux" }
    rewrite_rules: [{ type: http_date }]
  - name: http_other_generic
    signature: { offset: 0, min_length: 1 }
    response_file: responses/iis_404_not_found.bin
    rewrite_rules: [{ type: http_date }]
