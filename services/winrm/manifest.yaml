# WinRM (WS-Management) — TCP 5985, plaintext HTTP over HTTP.sys.
# Templates captured 2026-02-18 from a real Windows 11 25H2 box (HMDXIN).
#
# The listener is the kernel HTTP stack (HTTP.sys), so every response advertises
# `Server: Microsoft-HTTPAPI/2.0` — the fingerprint nmap -sV keys on
# ("Microsoft HTTPAPI httpd 2.0"). Behaviour by request, matching a real WinRM:
#
#   * POST (a WS-Man/SOAP request to /wsman), unauthenticated → 401 Unauthorized
#     challenging Negotiate + Kerberos — the WinRM auth handshake. (Was 404, a tell:
#     a real WinRM never 404s a POST to its endpoint, it challenges.)
#   * GET /wsman → 405 Method Not Allowed (Allow: POST) — the endpoint exists but
#     only accepts POST.
#   * Any other GET / probe → the canonical HTTP.sys 404 "Not Found" page.
#
# Every response carries a live Date via the http_date rewrite (finds the Date:
# header, writes the current RFC1123 time), fixing the frozen captured-Date tell.
#
# Edition note: WinRM listens by default on Server SKUs (2012+) but not on client
# SKUs, so this belongs in the `services:` list for server profiles. It is
# intentionally NOT edition-gated here — if an operator enables it (a real Win11
# client in OSE-2026-001 had it on), it answers faithfully.

name: winrm
port: 5985
protocol: tcp
stateful: false
description: "Windows Remote Management — Microsoft-HTTPAPI/2.0 (WS-Management)"

# Answer unmatched probes with the HTTP.sys 404 instead of a silent FIN.
default_response: responses/winrm_404_not_found.bin

probes:
  # Unauthenticated WS-Man SOAP POST → 401 Negotiate/Kerberos challenge.
  - name: winrm_soap_post
    signature: { pattern: 'POST ', offset: 0, min_length: 5 }
    response_file: responses/winrm_401.bin
    rewrite_rules: [{ type: http_date }]

  # GET /wsman → 405 Method Not Allowed (endpoint exists, POST-only).
  - name: winrm_get_wsman
    signature: { pattern: 'GET /wsman', offset: 0, min_length: 10 }
    response_file: responses/winrm_405_method_not_allowed.bin
    rewrite_rules: [{ type: http_date }]

  # Any other GET / probe → HTTP.sys 404 Not Found.
  - name: winrm_other
    signature: { offset: 0, min_length: 1 }
    response_file: responses/winrm_404_not_found.bin
    rewrite_rules: [{ type: http_date }]
