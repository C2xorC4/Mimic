# NetBIOS Session Service — TCP 139.
# When smb_honeypot is enabled on a Server/DC edition profile it binds 139
# directly with a positive session + full SMB bridge; this template is skipped.
# For replay-only deployments (no honeypot), server editions answer 0x82;
# workstation editions filter 139 entirely via os_edition gating in run.go.

name: netbios
port: 139
protocol: tcp
stateful: false
description: "NetBIOS Session Service (NBSS)"

probes:
  # Session Request (0x81) → positive session on Server SKUs.
  - name: session_request_positive
    requires: { os_edition: server }
    signature:
      pattern: '\x81'
      offset: 0
      min_length: 4
    response_file: responses/positive_session.bin
    rewrite_rules: []

  # Session Request on DC SKUs (same behaviour as server).
  - name: session_request_positive_dc
    requires: { os_edition: dc }
    signature:
      pattern: '\x81'
      offset: 0
      min_length: 4
    response_file: responses/positive_session.bin
    rewrite_rules: []

  # HTTP probe (nmap sends this to many ports) → negative session.
  - name: http_probe
    signature:
      pattern: 'GET '
      offset: 0
      min_length: 10
    response_file: responses/negative_session.bin
    rewrite_rules: []

  # SMB1 Negotiate without prior session → negative (wrong path for template-only).
  - name: smb1_over_netbios
    signature:
      pattern: '\x00...\xffSMBr'
      offset: 0
      min_length: 39
    response_file: responses/negative_session.bin
    rewrite_rules: []

  # Catch-all → negative session.
  - name: catchall
    signature:
      pattern: ''
      offset: 0
      min_length: 1
    response_file: responses/negative_session.bin
    rewrite_rules: []