name: "macOS Tahoe"
description: "macOS 26 Tahoe TCP/IP stack fingerprint (Darwin 25.x)"
family: macos
version: "26.5.1"

stack:
  # IP Layer
  ttl: 64
  df_bit: true
  ip_id_behavior: zero        # TI=Z — Darwin/XNU sends IP-ID=0 on all TCP packets

  # TCP Layer — from nmap capture: Kali→Tahoe 2026-06-29
  # OPS: M5B4NW6NNT11SLL  WIN: FFFF  TS=21
  window_size: 65535
  window_scale: 6
  mss: 1460
  tcp_timestamps: true
  sack_permitted: true
  tcp_options_order:
    - mss
    - nop
    - window_scale
    - nop
    - nop
    - timestamp
    - sack_permitted
    - eol

  # TCP Quirks
  ecn_support: true
  ack_in_rst: zero
  window_in_rst: 0

  # ECN: CC=Y on Tahoe (reflects ECE on ECN probe)
  explicit_congestion: echo

  # ICMP — U1(IPL=38h=56d → 8-byte quote), IE(DFI=S → DF mirrored)
  icmp_quote_size: 8
  icmp_df_in_quote: false
  icmp_ttl_in_quote: 64
  icmp_rate_limit: false

  # UDP
  udp_closed_port_response: true
