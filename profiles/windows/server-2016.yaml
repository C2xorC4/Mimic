name: "Windows Server 2016"
description: "Windows Server 2016 TCP/IP stack fingerprint"
family: windows
version: "10.0.14393"

stack:
  # IP Layer
  ttl: 128
  df_bit: true
  ip_id_behavior: incremental

  # TCP Layer
  window_size: 8192          # nmap-os-db Server 2016 WIN=2000
  window_scale: 8
  mss: 1460
  tcp_timestamps: true       # Server 2016 ref OPS=M5B4NW8ST11 (timestamp present, TS=A|U)
  sack_permitted: true
  tcp_options_order:
    - mss
    - nop
    - window_scale
    - sack_permitted
    - timestamp

  # TCP Quirks
  ecn_support: true
  urg_pointer: 0
  ack_in_rst: zero
  window_in_rst: 0
  fin_ack_behavior: rst
  bogus_flags: rst
  explicit_congestion: respond

  # ICMP
  icmp_quote_size: 8
  icmp_df_in_quote: true
  icmp_ttl_in_quote: 128
  icmp_rate_limit: false
  icmp_checksum_bad: false

  # UDP
  udp_closed_port_response: true

smb:
  dialect: "3.1.1"
  smb1_enabled: false
  signing_required: false
