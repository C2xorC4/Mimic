name: "Windows Server 2025"
description: "Windows Server 2025 TCP/IP stack fingerprint"
family: windows
# 26100 kernel (shares the 26x00 base with Win11 24H2/25H2). Stack values from a
# live nmap -O of a Server 2025 box (proxmox capture, 2026-06-11): WIN=FFFF,
# OPS O1=M5B4NW8ST11 (mss,nop,ws8,sack,timestamp), TS=A — i.e. window 65535 with
# TCP timestamps ON, matching the Win11 25H2 stack, NOT the 2022-era 8192/off.
# nmap 7.98 has no exact DB match for this vector yet ("No exact OS matches").
version: "10.0.26100"

stack:
  # IP Layer
  ttl: 128
  df_bit: true
  ip_id_behavior: incremental

  # TCP Layer - Values from nmap -O of Windows Server 2025
  window_size: 65535
  window_scale: 8
  mss: 1460
  tcp_timestamps: true
  sack_permitted: true
  tcp_options_order:
    - mss
    - nop
    - window_scale
    - sack_permitted
    - timestamp

  # TCP Quirks
  ecn_support: true
  urg_pointer: 0
  ack_in_rst: zero
  window_in_rst: 0
  fin_ack_behavior: rst
  bogus_flags: rst
  explicit_congestion: respond

  # ICMP
  icmp_quote_size: 8
  icmp_df_in_quote: true
  icmp_ttl_in_quote: 128
  icmp_rate_limit: false
  icmp_checksum_bad: false

  # UDP
  udp_closed_port_response: true

smb:
  dialect: "3.1.1"
  smb1_enabled: false
  signing_required: false
