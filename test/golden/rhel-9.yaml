# Golden fingerprint surface for the "RHEL" profile.
# Captured 2026-06-29 from a fresh RHEL 9.8 VM (kernel 5.14.0-687.19.1.el9_8.x86_64)
# scanned by Kali (nmap 7.98 -Pn -O --osscan-guess -sV -p 22,80,443).
# nmap attributes: "Linux 4.15 - 5.19" (same fingerprint family as Ubuntu/Fedora).
profile: "RHEL"

os_match:
  family: linux
  gens: ["4.X", "5.X"]

open_ports: [22]
closed_or_filtered: [80, 443]

services:
  22: "ssh"
